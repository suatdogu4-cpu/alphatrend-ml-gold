name: AlphaTrend ML - Altin Egitimi
on:
  workflow_dispatch:
    inputs:
      tf:
        description: 'Mum periyodu (1m, 5m, 15m)'
        required: true
        type: choice
        options: ['5m', '15m', '1m']
        default: '5m'
      symbol:
        description: 'Yahoo veri sembolu (GC=F: altin vadeli)'
        required: true
        default: 'GC=F'
        type: string
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Kutuphaneleri kur
        run: pip install -r requirements.txt
      - name: Kapanmis mum verisi cek
        run: python fetch_gold.py --symbol '${{ inputs.symbol }}' --tf '${{ inputs.tf }}' --output gold.csv
      - name: Egit ve test et
        run: python train.py --csv gold.csv --symbol '${{ inputs.symbol }}' --tf '${{ inputs.tf }}' --output result
      - name: Raporlari indirilebilir yap
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alphatrend-ml-egitim-sonucu
          path: |
            result/*.json
            result/*.csv
          if-no-files-found: warn
